[workspace]
resolver = "2"
members = ["crates/micrack-core", "apps/desktop"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
rtrb = "0.3"
vst3-host = "0.11"
libloading = "0.9"
base64 = "0.22"
tracing = "0.1"
hound = "3.5"
realfft = "3.5"
rustfft = "6.4"
ebur128 = "0.1"
windows ={ version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = 3